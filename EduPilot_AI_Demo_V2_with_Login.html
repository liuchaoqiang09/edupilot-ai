function login(){document.getElementById('root').innerHTML=`<div class="login"><section class="login-left"><div class="brand"><span class="brand-mark">E</span> EduPilot AI</div><div class="hero"><div class="eyebrow">TEACHING · INSIGHT · GROWTH</div><h1>把机构管理，<br>变成更清晰的日常。</h1><p>从排课、学员管理到 AI 课后反馈。让教学过程有记录，让每一次进步都有依据。</p><div class="hero-pill"><span class="dot"></span> 为中小培训机构设计的 AI 教学工作台</div></div><div class="login-foot">产品演示版 · 模拟数据 · 不连接真实机构</div></section><section class="login-right"><div class="login-card"><div class="eyebrow" style="color:var(--teal)">EDUPILOT AI DEMO</div><h2 style="margin-top:12px">进入你的工作台</h2><div class="sub">登录账号后进入工作台，也可以直接选择下方身份体验完整 Demo。</div><form id="demo-login-form" onsubmit="event.preventDefault();demoLogin()" style="display:grid;gap:13px;margin-top:22px"><label style="display:grid;gap:7px;font-size:12px;font-weight:700">账号<input id="demo-login-username" required autocomplete="username" placeholder="请输入演示账号" style="width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)"></label><label style="display:grid;gap:7px;font-size:12px;font-weight:700">密码<div style="position:relative"><input id="demo-login-password" type="password" required autocomplete="current-password" placeholder="请输入演示密码" style="width:100%;padding:12px 64px 12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)"><button type="button" onclick="toggleDemoPassword()" style="position:absolute;right:10px;top:8px;padding:5px 7px;background:transparent;color:var(--muted);font-size:11px">显示</button></div></label><div style="display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)"><label style="display:flex;align-items:center;gap:7px"><input type="checkbox" id="demo-remember"> 记住我</label><button type="button" onclick="toast('这是前端演示，没有真实账号和密码找回服务。请使用下方身份入口。')" style="background:transparent;color:var(--teal);font-size:12px">忘记密码？</button></div><div id="demo-login-error" class="hidden" style="padding:10px;border-radius:9px;background:var(--redbg);color:var(--red);font-size:12px">请输入账号和密码。</div><button type="submit" style="padding:13px 16px;border-radius:10px;background:var(--navy);color:white;font-weight:750">登录演示工作台　→</button><div style="display:flex;align-items:center;gap:12px;color:#93a19b;font-size:10px;margin:3px 0"><span style="height:1px;background:var(--line);flex:1"></span>或选择演示身份<span style="height:1px;background:var(--line);flex:1"></span></div></form><div class="account-list" style="margin-top:15px"><button class="account" onclick="enter('owner')"><span class="account-ico">⌂</span><span><strong>机构负责人</strong><small>经营概览 · 教务管理 · AI 报告审核</small></span><span class="go">→</span></button><button class="account" onclick="enter('teacher')"><span class="account-ico">✎</span><span><strong>教师</strong><small>我的课表 · 课堂记录 · AI 教学分析</small></span><span class="go">→</span></button><button class="account" onclick="enter('parent')"><span class="account-ico">♡</span><span><strong>家长</strong><small>孩子课表 · 出勤 · 已发布学习报告</small></span><span class="go">→</span></button></div><div class="demo-note">演示说明：此处为快速体验入口，不代表真实身份验证。正式产品需在服务端验证账号、机构关系和角色权限；家长端不能切换为老板或教师。</div></div></section></div>`}
function demoLogin(){const username=document.getElementById('demo-login-username').value.trim();const password=document.getElementById('demo-login-password').value;const error=document.getElementById('demo-login-error');if(!username||!password){error.classList.remove('hidden');return}error.classList.add('hidden');enter('owner');toast('演示登录成功。当前为模拟身份，不会验证真实账号。')}
function toggleDemoPassword(){const input=document.getElementById('demo-login-password');input.type=input.type==='password'?'text':'password';const button=input.parentElement.querySelector('button');button.textContent=input.type==='password'?'显示':'隐藏'}
function enter(role,dualOverride){state.role=role;state.page=role==='owner'?'overview':role==='teacher'?'myclasses':'children';state.dual=typeof dualOverride==='boolean'?dualOverride:(role==='owner');render()}
const menus={owner:[['总览','overview'],['学员管理','students'],['课程与班级','courses'],['排课与考勤','schedule'],['AI 教学报告','reports'],['报名与课时','billing'],['机构设置','settings']],teacher:[['我的课表','myclasses'],['课堂记录','record'],['AI 教学分析','reports']],parent:[['孩子概览','children'],['课表与出勤','schedule'],['学习报告','learning']]};
const titles={overview:['机构总览','先处理今天的教学安排，再查看机构经营情况。'],students:['学员管理','统一查看学员档案、报名课程、出勤和剩余课时。'],courses:['课程与班级','按机构实际业务配置课程、班级和授课教师。'],schedule:['排课与考勤','查看课程安排，记录出勤并处理需要关注的课次。'],reports:['AI 教学报告','AI 结合本次课堂记录与近期相关历史生成分析，教师确认后发布。'],billing:['报名与课时','记录报名、缴费状态与剩余课时，跟进需要续费的学员。'],settings:['机构设置','配置机构业务、教学评价规则和账号权限。'],myclasses:['我的课表','今天的授课安排，以及需要完成的教学记录。'],record:['课堂记录','把真实课堂情况记录下来，为 AI 分析提供依据。'],children:['孩子概览','查看孩子近期学习情况和待关注事项。'],learning:['学习报告','仅展示教师确认并发布的学习反馈。']};
function sidebar(){let role=state.role;return `<aside class="sidebar" id="sidebar"><div class="side-brand"><span class="brand-mark">E</span> EduPilot AI</div><div class="org-switch"><small>${role==='parent'?'家长账号':role==='teacher'?'教师工作台':'当前机构'}</small><strong>${role==='parent'?'林子涵 · 家长端':role==='teacher'?'青禾成长中心 · 教师端':'青禾成长中心'}</strong></div><div class="nav-label">工作空间</div><nav class="nav">${menus[role].map(([label,key])=>`<button class="${state.page===key?'active':''}" onclick="go('${key}')"><span class="ni">${icons[key]||'•'}</span>${label}</button>`).join('')}</nav><div class="side-bottom">${role==='owner'?'<div class="helpbox"><strong>产品使用提示</strong>先完成基础配置，再逐步录入学员和排课。AI 只根据真实教学记录生成建议。</div>':role==='teacher'?'<div class="helpbox"><strong>教学记录提醒</strong>课堂记录越具体，AI 分析越有依据。发布前请确认内容准确。</div>':'<div class="helpbox"><strong>学习反馈说明</strong>报告由教师确认后发布。如有疑问，请联系授课老师。</div>'}<div class="side-user"><span class="avatar">${role==='owner'?'周':role==='teacher'?'王':'林'}</span><div><strong>${role==='owner'?'周校长':role==='teacher'?'王老师':'林子涵家长'}</strong><small>${role==='owner'?'机构负责人':role==='teacher'?'数学教师':'家长'}</small></div></div></div></aside>`}
function header(){let role=state.role;return `<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="iconbtn mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div class="crumb">${role==='owner'?'机构工作台':role==='teacher'?'教师工作台':'家长工作台'}　/　<strong>${titles[state.page]?.[0]||''}</strong></div></div><div class="top-actions"><span class="role-chip">${role==='owner'?'机构负责人':role==='teacher'?'教师账号':'家长账号'}</span><button class="iconbtn" onclick="toast('目前没有新的系统通知')" title="通知">♧<span class="notice"></span></button><button class="user-menu" onclick="userMenu()"><span class="avatar">${role==='owner'?'周':role==='teacher'?'王':'林'}</span><span class="top-user-name"><strong>${role==='owner'?'周校长':role==='teacher'?'王老师':'林子涵家长'}</strong><small>${role==='owner'?'青禾成长中心':role==='teacher'?'数学组':'已绑定 1 位孩子'}</small></span><span class="muted">⌄</span></button></div></header>`}
function pageHead(title,desc,actions=''){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
function stat(label,value,icon,foot){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function scheduleRows(items){return items.map(x=>`<div class="schedule-item"><div class="time">${x.time}<small>${x.end||''}</small></div><div class="vline ${x.color==='orange'?'orange':x.color==='purple'?'purple':''}"></div><div><div class="class-title">${esc(x.title)}</div><div class="class-meta">${esc(x.teacher||'王老师')} · ${x.students} 人 · ${esc(x.room||'教室待定')}</div></div><span class="pill ${x.status==='待填写记录'?'wait':''}">${x.status||'已排课'}</span></div>`).join('')}
function overview(){return `${pageHead('早上好，周校长 👋','这是青禾成长中心今天的教学与经营概况。','<button class="btn secondary" onclick="go(\'schedule\')">▣ 查看课表</button><button class="btn primary" onclick="openModal(\'student\')">＋ 新增学员</button>')}<div class="grid stats">${stat('在读学员','128','♙','<span class="up">+8</span> 本月新增')}${stat('今日课程','12','▦','已排课 12 节 · 2 节待记录')}${stat('待续费学员','9','¥','未来 14 天内需要跟进')}${stat('待确认报告','2','✳','教师已提交，等待确认')}</div><div class="grid dashboard-grid"><section class="panel"><div class="panel-head"><div><h3>今日课程安排</h3><p>10 月 20 日 · 周二</p></div><button class="linkbtn" onclick="go('schedule')">查看全部 →</button></div><div class="schedule-list">${scheduleRows(state.schedule)}</div></section><section class="panel"><div class="panel-head"><div><h3>需要你处理</h3><p>优先处理影响教学流程的事项</p></div><span class="pill wait">4 项</span></div><div class="todo-list"><div class="todo"><span class="todo-ico">✳</span><div><strong>AI 教学报告待确认</strong><p>林子涵、许沐阳的课后反馈等待确认</p><button class="linkbtn" onclick="go('reports')">去查看 →</button></div><span class="count">2</span></div><div class="todo"><span class="todo-ico green">¥</span><div><strong>学员续费跟进</strong><p>未来两周有 9 位学员课时即将用完</p><button class="linkbtn" onclick="go('billing')">去跟进 →</button></div><span class="count">9</span></div><div class="todo"><span class="todo-ico">▣</span><div><strong>教学记录完成情况</strong><p>今天仍有 2 节课未提交课堂记录</p><button class="linkbtn" onclick="go('reports')">查看进度 →</button></div><span class="count">2</span></div></div></section></div><div class="grid bottom-grid"><section class="panel"><div class="panel-head"><div><h3>教学反馈完成率</h3><p>本周课堂记录与报告状态</p></div><span class="badge-count">本周</span></div>${[['课堂记录已提交',78],['AI 分析已生成',68],['报告已发布',54]].map(([n,v])=>`<div class="progress-row"><span class="progress-label">${n}</span><div class="bar"><span style="width:${v}%"></span></div><span class="progress-num">${v}%</span></div>`).join('')}</section><section class="panel"><div class="panel-head"><div><h3>本月报名概况</h3><p>新报名人数 · 模拟统计</p></div><span class="up">+12.5%</span></div><div class="mini-chart"><div class="bars">${[45,62,50,74,59,86,68,96].map((v,i)=>`<div class="barcol"><i class="${i===7?'current':''}" style="height:${v}%"></i><small>${['1','3','5','7','9','11','13','15'][i]}日</small></div>`).join('')}</div></div></section></div>`}
function studentsPage(){return `${pageHead('学员管理','所有学员统一建档；报名多个课程也只保留一份学员档案。','<button class="btn secondary" onclick="toast(\'演示版暂不支持导入文件\')">⇧ 导入名单</button><button class="btn primary" onclick="openModal(\'student\')">＋ 新增学员</button>')}<div class="table-tools"><div class="search"><span>⌕</span><input id="student-search" placeholder="搜索姓名、课程或教师" oninput="filterStudents()"></div><select class="select" id="student-filter" onchange="filterStudents()"><option value="all">全部状态</option><option value="在读">在读</option><option value="待续费">待续费</option></select><button class="btn secondary" onclick="toast('筛选条件已重置');document.getElementById('student-search').value='';document.getElementById('student-filter').value='all';filterStudents()">重置</button></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>学员</th><th>年级 / 班级</th><th>报名课程</th><th>负责教师</th><th>出勤率</th><th>剩余课时</th><th>状态</th><th>操作</th></tr></thead><tbody id="student-rows">${studentRows(state.students)}</tbody></table></div><div style="padding:14px 18px;border-top:1px solid #eef1ee;color:var(--muted);font-size:11px">共 ${state.students.length} 位演示学员 · 数据为模拟数据</div></section>`}
function studentRows(arr){return arr.map((s,i)=>`<tr><td><div class="person"><span class="avatar">${esc(s.initial)}</span><strong>${esc(s.name)}</strong></div></td><td>${esc(s.grade)}</td><td>${esc(s.courses)}</td><td>${esc(s.teacher)}</td><td>${esc(s.attendance)}</td><td><strong>${s.hours}</strong> 节</td><td><span class="pill ${s.status==='待续费'?'wait':''}">${s.status}</span></td><td><button class="row-actions" onclick="viewStudent(${i})">查看详情</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">没有找到符合条件的学员</td></tr>'}
function filterStudents(){let q=(document.getElementById('student-search')?.value||'').toLowerCase(),f=document.getElementById('student-filter')?.value||'all';let a=state.students.filter(s=>(f==='all'||s.status===f)&&[s.name,s.grade,s.courses,s.teacher].some(v=>v.toLowerCase().includes(q)));document.getElementById('student-rows').innerHTML=studentRows(a)}
function coursesPage(){let courses=[['中小学辅导','初二数学','科目排课 · 单次课指定学生','王老师','8 人'],['中小学辅导','初三英语','科目排课 · 单次课指定学生','李老师','12 人'],['艺术培训','钢琴进阶','固定班级 · 技能训练','赵老师','4 人'],['幼儿教育','幼儿成长活动','固定班级 · 集体活动','刘老师','10 人']];return `${pageHead('课程与班级','课程是教学内容，班级是组织方式，课次才是实际发生的一节课。','<button class="btn primary" onclick="openModal(\'course\')">＋ 创建课程</button>')}<div class="grid stats">${stat('已配置课程','16','▦','覆盖 3 类业务模式')}${stat('教学班级','11','♙','固定班级与学员分组')}${stat('授课教师','8','✎','可按课程授权')}${stat('本周课次','46','▣','排课后指定实际学员')}</div><section class="panel"><div class="panel-head"><div><h3>课程列表</h3><p>老板可自定义课程名称、类型和教学组织方式</p></div><button class="btn secondary" onclick="go('settings')">配置业务模式 →</button></div><div class="table-wrap"><table><thead><tr><th>业务类型</th><th>课程名称</th><th>教学组织方式</th><th>负责教师</th><th>学员规模</th><th>状态</th><th>操作</th></tr></thead><tbody>${courses.map(c=>`<tr><td><span class="pill neutral">${c[0]}</span></td><td><strong>${c[1]}</strong></td><td>${c[2]}</td><td>${c[3]}</td><td>${c[4]}</td><td><span class="pill">启用中</span></td><td><button class="row-actions" onclick="toast('课程详情可在完整版本中编辑')">编辑</button></td></tr>`).join('')}</tbody></table></div></section><div class="teacher-note" style="margin-top:15px"><strong>产品规则：</strong>中小学辅导允许每节课指定不同学生；艺术培训默认按艺术科目与班级组织；幼儿教育支持固定班级和集体活动。三类模式共用同一套底层课程、班级和课次结构。</div>`}
function schedulePage(){return `${pageHead(state.role==='parent'?'课表与出勤':'排课与考勤',state.role==='parent'?'查看孩子的课程安排和出勤记录。':'按日期查看课次；每节课单独指定教师、时间、地点与实际参加学生。',state.role==='owner'?'<button class="btn primary" onclick="openModal(\'schedule\')">＋ 创建课次</button>':'')}<div class="grid stats">${stat('今日课次','12','▣','8 节已完成 · 4 节待开始')}${stat('已记录出勤','86','✓','今日应到 94 人次')}${stat('请假 / 缺勤','5','◷','需要教师确认')}${stat('课时异常','2','!','建议检查补课与扣课时')}</div><section class="panel"><div class="panel-head"><div><h3>今日课程表</h3><p>2026 年 10 月 20 日 · 周二</p></div><span class="pill neutral">全部课程</span></div><div class="schedule-list">${scheduleRows(state.schedule)}</div></section><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>出勤记录</h3><p>课次完成后由教师记录，老板可查看全机构情况</p></div></div><div class="table-wrap"><table><thead><tr><th>课程</th><th>教师</th><th>应到</th><th>实到</th><th>缺勤 / 请假</th><th>状态</th></tr></thead><tbody>${[['初二数学 · 方程专题','王老师',8,7,1,'待确认'],['钢琴进阶 · 技巧训练','赵老师',4,4,0,'已完成'],['初三英语 · 阅读理解','李老师',12,11,1,'已完成']].map(r=>`<tr><td><strong>${r[0]}</strong></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td><span class="pill ${r[5]==='待确认'?'wait':''}">${r[5]}</span></td></tr>`).join('')}</tbody></table></div></section>`}
function reportsPage(){let isTeacher=state.role==='teacher';let arr=state.reports;return `${pageHead(isTeacher?'AI 教学分析':'AI 教学报告',isTeacher?'填写真实课堂记录，AI 会结合近期相关课程摘要给出问题分析和教学建议。':'查看教师提交的报告；常规报告由教师确认，老板可抽查、退回或处理异常。',isTeacher?'<button class="btn primary" onclick="openModal(\'record\')">＋ 填写课堂记录</button>':'<button class="btn secondary" onclick="toast(\'已筛选待确认报告\')">待确认优先</button>')}<div class="grid stats">${stat('本周已生成','36','✳','AI 已完成初稿')}${stat('待教师确认','4','✎','教师需检查分析是否准确')}${stat('待老板关注','2','◷','仅异常或抽查项目')}${stat('已发布报告','30','✓','家长端可查看')}</div><div class="report-layout"><section class="panel"><div class="panel-head"><div><h3>报告列表</h3><p>点击查看分析内容与历史依据</p></div><select class="select" id="report-filter" onchange="filterReports()"><option value="all">全部状态</option><option value="待确认">待确认</option><option value="已发布">已发布</option></select></div><div id="report-list">${reportList(arr)}</div></section><section class="panel"><div class="panel-head"><div><h3>分析详情</h3><p>示例：林子涵 · 初二数学</p></div><span class="pill wait">待确认</span></div><div class="report-card"><h3>方程专题学习反馈</h3><p>10 月 20 日 · 王老师 · 初二数学</p><div class="report-section"><h4>本次学习总结</h4><p>本节课完成一元一次方程练习。基础计算较稳定，移项符号错误较上次减少，但应用题中的数量关系理解仍需加强。</p></div><div class="report-section"><h4>发现的问题</h4><p>应用题列式时容易遗漏条件；当前记录显示这一问题仍需关注，暂不直接判断为长期固定薄弱点。</p></div><div class="report-section"><h4>下一步教学建议</h4><p>下次保留少量移项练习，重点练习“读题—标记条件—列方程”的步骤。</p></div><div class="evidence"><span>✓ 本次课堂记录</span><span>↻ 近 3 次相关课程</span></div><div class="callout">AI 分析依据：近期记录中出现过类似的移项错误。本次记录显示基础错误减少，因此建议继续观察，而不是直接认定问题已经解决。</div>${isTeacher?'<div class="actions" style="margin-top:16px"><button class="btn secondary" onclick="openModal(\'record\')">编辑课堂记录</button><button class="btn primary" onclick="publishReport(0)">确认并发布</button></div>':'<div class="actions" style="margin-top:16px"><button class="btn secondary" onclick="returnReport(0)">退回修改</button><button class="btn primary" onclick="publishReport(0)">确认发布</button></div>'}</div></section></div>`}
function reportList(arr){return arr.map((r,i)=>`<button onclick="selectReport(${i})" style="width:100%;text-align:left;padding:17px 18px;background:white;border-bottom:1px solid #eef1ee;display:flex;gap:12px;align-items:flex-start"><span class="avatar">${r.student[0]}</span><span style="flex:1;min-width:0"><strong style="display:block;font-size:12px;margin-bottom:5px;color:var(--ink)">${r.student} · ${r.course}</strong><span class="muted" style="font-size:11px;display:block;line-height:1.6">${r.summary.slice(0,58)}…</span><span class="muted" style="font-size:10px;display:block;margin-top:8px">${r.date}</span></span><span class="pill ${r.status==='待确认'?'wait':''}">${r.status}</span></button>`).join('')||'<div class="empty">没有符合条件的报告</div>'}
function filterReports(){let f=document.getElementById('report-filter').value;document.getElementById('report-list').innerHTML=reportList(state.reports.filter(r=>f==='all'||r.status===f))}

function recordPage(){return `${pageHead('课堂记录','先记录观察到的事实，再让 AI 总结。不要填写没有观察到的表现。','<button class="btn secondary" onclick="go(\'myclasses\')">返回我的课表</button>')}<div class="report-layout"><section class="panel"><div class="panel-head"><div><h3>填写课后记录</h3><p>初二数学 · 方程专题 · 2026 年 10 月 20 日</p></div><span class="pill">草稿</span></div><div class="report-card"><div class="field"><label>本节课学习内容</label><input id="rec-topic" value="一元一次方程与应用题"></div><div class="field"><label>课堂表现与已完成内容</label><textarea id="rec-perf">基础计算较稳定，能独立完成大部分基础题。</textarea></div><div class="field"><label>观察到的问题</label><textarea id="rec-issue">应用题列式时偶尔遗漏已知条件；移项符号错误较前次减少。</textarea></div><div class="field"><label>作业 / 练习情况</label><textarea id="rec-homework">完成课堂练习 8 题，其中 6 题正确。</textarea></div><button class="btn primary" onclick="generateAnalysis()">✳ 生成 AI 教学分析</button></div></section><section class="panel"><div class="panel-head"><div><h3>近期历史摘要</h3><p>自动整理最近 3 次相关课程</p></div><span class="pill">已匹配</span></div><div class="report-card"><div class="report-section"><h4>重复出现的问题</h4><p>过去两次相关课程均有移项符号错误的记录。</p></div><div class="report-section"><h4>近期变化</h4><p>上次记录基础计算仍需练习；本次教师记录显示错误减少，建议继续观察。</p></div><div class="report-section"><h4>使用边界</h4><p>历史摘要只辅助本次分析，不能替代原始记录。无历史数据时，系统只分析本次课堂。</p></div><div id="analysis-output"></div></div></section></div>`}

function parentLearning(){return `${pageHead('学习报告','报告由教师确认后发布；家长不能查看草稿、其他学生数据或机构经营信息。')}<div class="grid" style="grid-template-columns:1fr;gap:14px">${state.parentReports.map(r=>`<section class="panel"><div class="panel-head"><div><h3>${r.title}</h3><p>${r.date} · ${r.course} · 王老师</p></div><span class="pill">已发布</span></div><div class="report-card"><div class="report-section"><h4>本次学习总结</h4><p>${r.summary}</p></div><div class="report-section"><h4>下一步建议</h4><p>${r.suggestion}</p></div><div class="evidence"><span>教师已确认</span><span>学习反馈</span></div></div></section>`).join('')}</div>`}
function pageContent(){switch(state.page){case'overview':return overview();case'students':return studentsPage();case'courses':return coursesPage();case'schedule':return schedulePage();case'reports':return reportsPage();case'billing':return billingPage();case'settings':return settingsPage();case'myclasses':return teacherClasses();case'record':return recordPage();case'children':return parentChildren();case'learning':return parentLearning();default:return overview()}}
function go(p){let role=state.role;if(role==='parent'&&!['children','schedule','learning'].includes(p)){toast('当前家长账号无权访问该页面');return}if(role==='teacher'&&!['myclasses','record','reports'].includes(p)){toast('当前教师账号无权访问该页面');return}state.page=p;render();window.scrollTo(0,0)}
function userMenu(){let role=state.role;let choices=role==='owner'?`<button class="btn secondary" onclick="enter('teacher',true)">切换到教师工作台（演示兼任身份）</button>`:role==='teacher'&&state.dual?`<button class="btn secondary" onclick="enter('owner',true)">切换回机构负责人工作台</button>`:role==='teacher'?`<button class="btn secondary" onclick="toast('此演示教师账号没有老板角色授权')">无其他已授权工作台</button>`:`<button class="btn secondary" onclick="toast('家长账号不能切换为老板或教师')">当前账号仅有家长权限</button>`;modal('账号与工作台',`<p class="sub" style="margin-top:0">${role==='owner'?'周校长 · 机构负责人（演示账号同时获授权教师角色）':role==='teacher'?'王老师 · 教师':'林子涵家长 · 家长'}</p><div class="grid" style="gap:10px">${choices}<button class="btn secondary" onclick="login()">退出并返回演示入口</button></div>`,'')}
function openModal(type){let body='',title='';if(type==='student'){title='新增学员';body=`<div class="form-grid"><div class="field"><label>学员姓名 *</label><input id="f-name" placeholder="请输入姓名"></div><div class="field"><label>年级 / 班级</label><input id="f-grade" placeholder="例如：初二"></div><div class="field"><label>报名课程</label><input id="f-course" placeholder="例如：数学、英语"></div><div class="field"><label>负责教师</label><input id="f-teacher" placeholder="例如：王老师"></div><div class="field"><label>家长联系方式</label><input placeholder="选填"></div><div class="field"><label>初始课时</label><input id="f-hours" type="number" value="12" min="0"></div></div><div class="sub">新增后可继续补充家长绑定、报名和出勤信息。</div>`}else if(type==='schedule'){title='创建课次';body=`<div class="form-grid"><div class="field"><label>课程名称 *</label><input id="f-title" placeholder="例如：初二数学"></div><div class="field"><label>授课教师 *</label><input id="f-tutor" placeholder="例如：王老师"></div><div class="field"><label>开始时间</label><input id="f-time" type="time" value="15:00"></div><div class="field"><label>结束时间</label><input id="f-end" type="time" value="16:30"></div><div class="field"><label>教室</label><input id="f-room" placeholder="例如：A201"></div><div class="field"><label>实际参加人数</label><input id="f-count" type="number" value="8" min="1"></div></div><div class="sub">完整版本会在这里选择实际参加学生，并校验教师与时间冲突。</div>`}else if(type==='course'){title='创建课程';body=`<div class="field"><label>课程名称 *</label><input id="f-course-title" placeholder="例如：初二数学"></div><div class="field"><label>业务类型</label><select id="f-course-type"><option>中小学辅导</option><option>艺术培训</option><option>幼儿教育</option></select></div><div class="field"><label>教学组织方式</label><select><option>学员分组 + 单次课指定学生</option><option>固定班级</option><option>集体活动</option></select></div><div class="sub">课程、班级与课次相互独立；机构可按实际业务自定义名称和组织方式。</div>`}else if(type==='record'){title='填写课堂记录';body=`<div class="field"><label>课程</label><select><option>初二数学 · 方程专题</option><option>初三数学 · 二次函数</option></select></div><div class="field"><label>本节课内容</label><textarea id="f-rec-topic" placeholder="本节课教了什么"></textarea></div><div class="field"><label>观察到的问题</label><textarea id="f-rec-issue" placeholder="只填写真实观察到的问题"></textarea></div><div class="field"><label>作业情况</label><textarea id="f-rec-home" placeholder="作业完成情况"></textarea></div><div class="sub">保存后可进入 AI 教学分析页生成课后报告、问题与建议。</div>`}else{title='记录报名';body=`<div class="field"><label>学员姓名 *</label><input placeholder="请输入学员姓名"></div><div class="field"><label>报名课程</label><input placeholder="课程名称"></div><div class="form-grid"><div class="field"><label>应收金额</label><input type="number" placeholder="0.00"></div><div class="field"><label>实收金额</label><input type="number" placeholder="0.00"></div></div><div class="field"><label>购买课时</label><input type="number" value="12"></div>`}modal(title,body,`<button class="btn secondary" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveModal('${type}')">保存</button>`)}
function modal(title,body,foot){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="iconbtn" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function saveModal(type){if(type==='student'){let name=document.getElementById('f-name').value.trim();if(!name){toast('请先填写学员姓名');return}let grade=document.getElementById('f-grade').value||'待完善',course=document.getElementById('f-course').value||'待分配',teacher=document.getElementById('f-teacher').value||'待分配',hours=Number(document.getElementById('f-hours').value||0);state.students.unshift({name,grade,courses:course,teacher,attendance:'—',hours,status:'在读',initial:name[0]});closeModal();render();toast('学员已添加到演示数据')}else if(type==='schedule'){let title=document.getElementById('f-title').value.trim();if(!title){toast('请填写课程名称');return}state.schedule.push({time:document.getElementById('f-time').value||'15:00',end:document.getElementById('f-end').value||'16:30',title,teacher:document.getElementById('f-tutor').value||'待分配',students:Number(document.getElementById('f-count').value||1),room:document.getElementById('f-room').value||'待定',color:'green'});closeModal();render();toast('课次已添加（演示数据）')}else if(type==='course'){let title=document.getElementById('f-course-title').value.trim();if(!title){toast('请填写课程名称');return}closeModal();toast('课程已创建（当前仅演示交互，未持久化）')}else if(type==='record'){closeModal();go('record');toast('已进入课堂记录页面')}else{closeModal();toast('报名记录已保存（演示交互）')}}
function viewStudent(i){let s=state.students[i];modal('学员档案',`<div class="person" style="margin-bottom:18px"><span class="avatar">${esc(s.initial)}</span><div><strong>${esc(s.name)}</strong><div class="muted" style="font-size:11px;margin-top:5px">${esc(s.grade)} · ${esc(s.status)}</div></div></div><div class="report-section"><h4>报名课程</h4><p>${esc(s.courses)}</p></div><div class="report-section"><h4>负责教师</h4><p>${esc(s.teacher)}</p></div><div class="report-section"><h4>出勤与课时</h4><p>出勤率 ${esc(s.attendance)} · 剩余 ${s.hours} 节</p></div><div class="callout">演示档案仅展示基础字段。正式产品会按权限展示家长绑定、完整历史课程、出勤与已发布报告。</div>`,'<button class="btn secondary" onclick="closeModal()">关闭</button>')}
function toast(msg){let r=document.getElementById('toast-root');r.innerHTML=`<div class="toast">${msg}</div>`;setTimeout(()=>{r.innerHTML=''},2600)}
function render(){if(!state.role){login();return}document.getElementById('root').innerHTML=`<div class="shell">${sidebar()}<main class="main">${header()}<div class="content">${pageContent()}</div></main></div>`}
login();
</script></body></html>
